<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型与运算符</title>
    <style>
        div{
            width: 180px;
            height: 180px;
            background-color: red;
            margin: 10px;
            color: white;
            text-align: center;
            line-height: 180px;
            font-size: 100px;
            float: left;
        }
    </style>
</head>
<body>
    <script>
   var a = 6,b = 1;
    console.log(a + b);
    console.log(a++,++b);
    console.log(a-b>0?a:b);
    console.log(true&&false,true||true,!true);
        var str='hallo word',num=123,bl=trun,obj={name:'张三',age:18},ud,
        kong=null;
        console.log(typeof typeof bl,typeof obj,typeof ud,typeof kong);
        console.log(0.1+0.2==0.3)
        //JS不能==或者===判断两个对象是否相等，两个对象即使内容一样也不相等
        //应为浮点数不能用二进制精确储存
        //数据类型转换:+号的时候将数字转化成字符串，—号只用于数字运算，其他运算符会将字符串转化成数字
        console.log(1+"1","1"-1,"11"+1-1);
        console.log("wuyiming"-1);
        // NaN:不是一个数字，NaN是一个特殊的数字类型，表示不是一个数字,与任何变量都不相等，包括他自己
        console.log(isNaN(NaN));
        console.log(NaN==NaN,null==null);
        //isNaN()函数用于判断一个值是否是NaN,如果是返回true,否则返回false
        //parseInt()是取整向下取整，函数用于将一个字符串解析成整数,如果字符串不能解析成整数,则返回NaN
        console.log(parseInt(123.79));
        //如果想判断一个数值是不是整数，可以使用Number.isInteger()方法
        var num = 123;
        console.log(Number.isInteger(num));
        //parseInt()函数的第二个参数是进制，表示将字符串解析成指定进制的整数
        console.log(parseInt("100",16));
        //1-100求和
        var sum = 0;
        for(var i=1;i<=100;i++){
            sum+=i;
        }
        //数7，（7的倍数，最大到99，个位数是7，或十位数是7,不显示数字）
        var count = 0;
        for(var i=1;i<=99;i++){
            if(i%7==0||i%10==7||parseInt(i/10)==7){
                document.write("<div></div>");
            }
            else{
                document.write("<div>"+i+"</div>");
            }
        }
        //回文数显示
    </script>
</body>
</html>
