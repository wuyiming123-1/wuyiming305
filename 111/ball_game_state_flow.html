.card-sub { margin: 0 0 var(--spacer-16); font: 400 var(--text-caption) var(--font-sans); color: var(--text-muted); }
.card svg { display: block; }
.th { fill: var(--text); font: var(--weight-medium) var(--text-body) var(--font-sans); }
.ts { fill: var(--text-muted); font: 400 var(--text-caption) var(--font-sans); }
.cap { fill: var(--text-muted); font: var(--weight-medium) var(--text-caption) var(--font-sans); }
.c-neutral > rect { fill: var(--surface-muted); stroke: var(--border); }
.c-brand > rect { fill: var(--brand-soft); stroke: var(--brand); }
.c-brand > .th { fill: var(--brand-text); }
.c-brand > .ts { fill: var(--brand-text); }
.capsule { fill: var(--surface); stroke: var(--border); }
.arr { stroke: var(--text-muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.arr-main { stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.mk-brand { fill: var(--brand); }
.mk-muted { fill: var(--text-muted); }
.chips { display: flex; flex-wrap: wrap; gap: var(--spacer-8); margin-top: var(--spacer-16); }
.chip { background: var(--surface-muted); border: 1px solid var(--border); border-radius: var(--radius-full); padding: var(--spacer-4) var(--spacer-12); font: 400 var(--text-caption) var(--font-sans); color: var(--text-muted); }
.chip b { font: var(--weight-medium) var(--text-code) var(--font-mono); color: var(--text); }
</style>
<div class="widget" data-dynamic-ui-widget data-template="game-state-flow">
  <div class="card">
    <p class="card-title">抓小球游戏 · 状态流转</p>
    <p class="card-sub">倒计时 2:00 · 单球 · 分数可为负</p>
    <svg viewBox="0 0 720 224" width="100%" height="auto" role="img" aria-label="游戏状态流转：待开始、进行中、结束，可再来一局">
      <defs>
        <marker id="ahB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" class="mk-brand"></path>
        </marker>
        <marker id="ahM" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" class="mk-muted"></path>
        </marker>
      </defs>
      <g class="c-neutral">
        <rect x="60" y="72" width="150" height="56" rx="28"></rect>
        <text x="135" y="96" text-anchor="middle" class="th">待开始</text>
        <text x="135" y="115" text-anchor="middle" class="ts">开始按钮 · 无小球</text>
      </g>
      <g class="c-brand">
        <rect x="300" y="72" width="180" height="56" rx="8"></rect>
        <text x="390" y="96" text-anchor="middle" class="th">进行中</text>
        <text x="390" y="115" text-anchor="middle" class="ts">倒计时 2:00 · 单球</text>
      </g>
      <g class="c-neutral">
        <rect x="550" y="72" width="130" height="56" rx="28"></rect>
        <text x="615" y="96" text-anchor="middle" class="th">结束</text>
        <text x="615" y="115" text-anchor="middle" class="ts">结算面板 · 命中率</text>
      </g>
      <path class="arr-main" d="M 214 100 L 297 100" marker-end="url(#ahB)"></path>
      <path class="arr-main" d="M 484 100 L 547 100" marker-end="url(#ahB)"></path>
      <path class="arr" d="M 615 132 L 615 178 Q 615 184 609 184 L 396 184 Q 390 184 390 178 L 390 136" marker-end="url(#ahM)"></path>
      <g>
        <rect x="225" y="72" width="60" height="20" rx="10" class="capsule"></rect>
        <text x="255" y="86" text-anchor="middle" class="cap">点击开始</text>
        <rect x="491" y="72" width="48" height="20" rx="10" class="capsule"></rect>
        <text x="515" y="86" text-anchor="middle" class="cap">时间到</text>
        <rect x="475" y="150" width="60" height="20" rx="10" class="capsule"></rect>
        <text x="505" y="164" text-anchor="middle" class="cap">再来一局</text>
      </g>
    </svg>
    <div class="chips">
      <span class="chip">点中 <b>+2</b></span>
      <span class="chip">连击 ≥3 <b>每次 +3</b></span>
      <span class="chip">点空白 <b>−1</b></span>
      <span class="chip">超时 <b>换位不扣分 · 连击归零</b></span>
    </div>
  </div>
</div>
</div>
